<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kesan dan Pesan Anjangsana</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#FBF6F4;--card:#fff;--ink:#2B1816;--muted:#7A625E;--line:#EADBD6;--red:#C2271D;--soft:#F6E3DE}
@media (prefers-color-scheme:dark){:root{--bg:#190F0E;--card:#251817;--ink:#F6E9E6;--muted:#B79C97;--line:#3A2624;--red:#E5483D;--soft:#3A201D;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;padding:0 16px 48px}
main{max-width:520px;margin:0 auto}
.top{border-top:10px solid var(--red);margin:0 -16px 24px}
h1{font-family:Lora,Georgia,serif;font-size:28px;line-height:1.15;margin:0 0 6px;text-wrap:balance}
p.lead{color:var(--muted);margin:0 0 20px}
form{display:grid;gap:16px}
label{display:grid;gap:6px;font-weight:700;font-size:14px}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}
textarea{min-height:170px;resize:vertical;font-family:Lora,Georgia,serif;font-size:17px}
.photo{border:2px dashed var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;justify-items:center;text-align:center;background:var(--card)}
.photo img{max-width:100%;max-height:260px;border-radius:8px}
button{font:inherit;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 16px;cursor:pointer}
button.primary{background:var(--red);color:#fff;border-color:var(--red);padding:14px;font-size:17px}
button:disabled{opacity:.6}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.err{color:var(--red);font-weight:500;min-height:1.4em}
.hp{position:absolute;left:-9999px}
.done{text-align:center;padding:40px 0;display:grid;gap:14px;justify-items:center}
.done svg{width:120px}
</style>
</head>
<body>
<div class="top"></div>
<main>
  <div id="formView">
    <h1>Kesan dan Pesan Anjangsana</h1>
    <p class="lead">Tulis kesan dan pesanmu. Setelah dikirim, pesanmu langsung tampil di layar acara.</p>
    <form id="f">
      <label for="name">Nama kamu<input type="text" id="name" maxlength="80" autocomplete="name" required placeholder="Contoh: Kekey"></label>
      <label for="message">Kesan dan pesan<textarea id="message" maxlength="3000" required placeholder="Tulis di sini…"></textarea></label>
      <div class="photo">
        <strong style="font-size:14px">Foto (boleh dikosongkan)</strong>
        <img id="prev" alt="Pratinjau foto" hidden>
        <input type="file" id="photo" accept="image/*" hidden>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
          <button type="button" id="pick">Pilih foto</button>
          <button type="button" id="clear" hidden>Hapus foto</button>
        </div>
      </div>
      <input class="hp" type="text" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="err" id="err" role="alert"></div>
      <button class="primary" id="send" type="submit">Kirim</button>
    </form>
  </div>
  <div class="done" id="doneView" hidden>
    <svg viewBox="0 0 120 100" fill="none" aria-hidden="true"><rect x="10" y="30" width="100" height="62" rx="4" fill="var(--card)" stroke="var(--ink)" stroke-width="4"/><path d="M10 34l50 36 50-36" stroke="var(--ink)" stroke-width="4"/><path d="M60 62c-14-12-24-18-24-28 0-7 6-11 12-11 5 0 10 3 12 8 2-5 7-8 12-8 6 0 12 4 12 11 0 10-10 16-24 28z" fill="var(--red)" transform="translate(6 4) scale(.9)"/></svg>
    <h1>Terkirim, terima kasih!</h1>
    <p class="lead">Lihat pesanmu muncul di layar.</p>
    <button id="again">Kirim pesan lain</button>
  </div>
</main>
<script>
(function(){
  var $=function(i){return document.getElementById(i)}, photoData="";
  $("pick").onclick=function(){$("photo").click()};
  $("clear").onclick=function(){photoData="";$("photo").value="";$("prev").hidden=true;$("clear").hidden=true;$("pick").textContent="Pilih foto"};
  function shrink(file,max){return new Promise(function(res,rej){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){var r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",0.82))};
    img.onerror=function(){rej(new Error("Foto tidak bisa dibaca. Coba foto lain."))};img.src=u})}
  $("photo").onchange=async function(e){
    var f=e.target.files[0]; if(!f)return; $("err").textContent="";
    try{photoData=await shrink(f,1400);$("prev").src=photoData;$("prev").hidden=false;$("clear").hidden=false;$("pick").textContent="Ganti foto"}
    catch(x){$("err").textContent=x.message}
  };
  $("f").onsubmit=async function(e){
    e.preventDefault();var b=$("send");b.disabled=true;b.textContent="Mengirim…";$("err").textContent="";
    try{
      var r=await fetch("/api/kirim",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:$("name").value,message:$("message").value,photo:photoData,website:$("website").value})});
      var j=await r.json().catch(function(){return{}});
      if(!r.ok)throw new Error(j.error||"Gagal mengirim. Coba lagi.");
      $("formView").hidden=true;$("doneView").hidden=false;
    }catch(x){$("err").textContent=x.message}
    b.disabled=false;b.textContent="Kirim";
  };
  $("again").onclick=function(){$("message").value="";$("photo").value="";$("clear").onclick();$("doneView").hidden=true;$("formView").hidden=false;$("message").focus()};
})();
</script>
</body>
</html>
