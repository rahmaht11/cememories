<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dinding Kenangan Anjangsana</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#190F0E;--panel:#251817;--ink:#F6E9E6;--muted:#B79C97;--line:#3A2624;--red:#E5483D;--paper:#FFFBF8;--paper-ink:#2B1816}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:4px solid var(--red);flex:0 0 auto;flex-wrap:wrap}
h1{font-family:Lora,Georgia,serif;font-size:clamp(20px,2.6vw,36px);margin:0;flex:1 1 280px;line-height:1.15}
.count{font-weight:700;color:var(--red);font-variant-numeric:tabular-nums;font-size:clamp(16px,1.8vw,24px)}
.tools{display:flex;gap:8px;flex-wrap:wrap;transition:opacity .3s}
:fullscreen .tools{opacity:0}
:fullscreen .tools:hover,:fullscreen .tools:focus-within{opacity:1}
button{font:inherit;font-weight:500;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button[aria-pressed=true]{background:var(--red);color:#190F0E;border-color:var(--red);font-weight:700}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.qr{display:flex;align-items:center;gap:10px;background:#fff;color:#2B1816;border-radius:10px;padding:6px 12px 6px 6px;font-weight:700;font-size:13px;line-height:1.25}
.qr div#qrbox{width:64px;height:64px}
.qr div#qrbox img,.qr div#qrbox canvas{width:64px!important;height:64px!important}
main{flex:1 1 auto;overflow-y:auto;padding:20px 24px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card:hover,.card:focus-visible{border-color:var(--red)}
.card.new{animation:pop .9s ease both}
.ph{aspect-ratio:4/3;background:#3A201D;display:grid;place-items:center;color:var(--red)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tx{padding:12px 14px 14px}
.from{font-weight:700;overflow-wrap:anywhere}
.pv{font-family:Lora,Georgia,serif;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px}
.empty{border:2px dashed var(--line);border-radius:14px;padding:60px 20px;text-align:center;color:var(--muted);font-size:18px}
.empty strong{display:block;color:var(--ink);font-family:Lora,Georgia,serif;font-size:28px;margin-bottom:8px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
/* overlay */
#ov{position:fixed;inset:0;background:rgba(10,4,3,.9);display:none;align-items:center;justify-content:center;padding:3vmin;z-index:10}
#ov.on{display:flex}
.stage{width:min(1400px,100%);max-height:100%;display:flex;flex-direction:column;align-items:center;gap:2vmin}
.env{width:min(26vmin,220px);cursor:pointer}
.env .flap{transform-origin:50% 22%;animation:flap .8s .25s ease both}
@keyframes flap{to{transform:rotateX(180deg)}}
.letter{background:var(--paper);color:var(--paper-ink);border-radius:18px;border-top:1.6vmin solid var(--red);width:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:3vmin;padding:3.5vmin;animation:rise .7s 1s ease both;max-height:78vh;overflow:hidden}
.letter.photo{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:center}
.letter img{width:100%;max-height:68vh;object-fit:contain;border-radius:10px;background:#f1e5e0}
.letter .who{font-family:Lora,Georgia,serif;font-weight:700;font-size:clamp(24px,4.2vmin,54px);margin-bottom:1.4vmin}
.letter .msg{font-family:Lora,Georgia,serif;font-size:clamp(20px,3.8vmin,48px);line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-height:60vh;overflow:hidden}
.ovtools{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:12px;display:flex;gap:8px;z-index:11}
.pin{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;gap:6px;align-items:center}
.pin input{font:inherit;width:110px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(5vmin)}to{opacity:1;transform:none}}
@media (max-width:820px){.letter.photo{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.env .flap,.letter,.card.new{animation:none}.env .flap{transform:rotateX(180deg)}}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;display:none}
</style>
</head>
<body>
<header>
  <h1 id="ttl">Dinding Kenangan Anjangsana</h1>
  <div class="qr" id="qr" hidden><div id="qrbox"></div><div>Scan untuk kirim<br>kesan dan pesan</div></div>
  <div class="count" id="count" aria-live="polite"></div>
  <div class="tools">
    <button id="bAuto" aria-pressed="false">Putar otomatis</button>
    <button id="bFull">Layar penuh</button>
    <button id="bAlbum">Unduh album</button>
  </div>
</header>
<main><div class="grid" id="grid"></div></main>
<div id="ov" role="dialog" aria-modal="true" aria-label="Kesan dan pesan"></div>
<div id="toast" role="status"></div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var HOLD=14000, entries=[], known={}, afterKey="", first=true, queue=[], showing=false, timer=null, autoIdx=0, auto=false, manual=false, isAdmin=false;
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";setTimeout(function(){e.style.display="none"},3000)}
  function photo(e){return e.hasPhoto?"/api/foto?id="+encodeURIComponent(e.id):""}
  try{auto=localStorage.getItem("auto")==="1"}catch(x){}
  $("bAuto").setAttribute("aria-pressed",auto);

  var envSvg='<svg class="env" viewBox="0 0 120 100" fill="none" aria-hidden="true"><rect x="10" y="30" width="100" height="62" rx="4" fill="#FFFBF8" stroke="#F6E9E6" stroke-width="4"/><path d="M60 66c-14-12-24-18-24-28 0-7 6-11 12-11 5 0 10 3 12 8 2-5 7-8 12-8 6 0 12 4 12 11 0 10-10 16-24 28z" fill="#E5483D"/><path d="M10 34l50 36 50-36" stroke="#F6E9E6" stroke-width="4" stroke-linejoin="round"/><path class="flap" d="M10 30L60 6l50 24" stroke="#F6E9E6" stroke-width="4" stroke-linejoin="round" fill="#FFFBF8"/></svg>';

  function render(){
    $("count").textContent=entries.length?entries.length+" kenangan":"";
    var g=$("grid");
    if(!entries.length){g.innerHTML='<div class="empty" style="grid-column:1/-1"><strong>Menunggu kesan dan pesan pertama</strong>Scan kode QR di pojok atas untuk mengirim.</div>';return}
    var list=entries.slice().reverse();
    g.innerHTML=list.map(function(e){
      var p=photo(e);
      return '<button class="card'+(e._new?' new':'')+'" data-id="'+esc(e.id)+'" aria-label="Buka pesan dari '+esc(e.name)+'"><div class="ph">'+
        (p?'<img loading="lazy" alt="" src="'+p+'">':'<svg width="56" height="56" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3"><rect x="6" y="14" width="52" height="36" rx="3"/><path d="M6 17l26 20 26-20"/></svg>')+
        '</div><div class="tx"><div class="from">Dari '+esc(e.name)+'</div><div class="pv">'+esc(e.message)+'</div></div></button>';
    }).join("");
    entries.forEach(function(e){delete e._new});
  }

  /* ----- overlay ----- */
  function openLetter(e,hold){
    clearTimeout(timer); showing=true; manual=!hold;
    var p=photo(e);
    $("ov").className="on";
    $("ov").innerHTML='<div class="ovtools"><button id="oPrev" aria-label="Sebelumnya">‹</button><button id="oNext" aria-label="Berikutnya">›</button><button id="oDel" hidden>Hapus</button><button id="oClose">Tutup</button></div>'+
      '<div class="stage">'+envSvg+'<div class="letter'+(p?' photo':'')+'">'+(p?'<img alt="Foto dari '+esc(e.name)+'" src="'+p+'">':'')+
      '<div><div class="who">Dari '+esc(e.name)+'</div><div class="msg">'+esc(e.message)+'</div></div></div></div>';
    $("oClose").onclick=closeLetter;
    $("oPrev").onclick=function(){step(-1,e)}; $("oNext").onclick=function(){step(1,e)};
    $("oDel").hidden=false; $("oDel").onclick=function(){askDelete(e)};
    $("ov").onclick=function(ev){if(ev.target.id==="ov")closeLetter()};
    if(hold)timer=setTimeout(closeLetter,hold);
  }
  function step(d,e){
    var i=entries.findIndex(function(x){return x.id===e.id});
    var n=entries[(i+d+entries.length)%entries.length]; if(n)openLetter(n,0);
  }
  function closeLetter(){
    clearTimeout(timer);$("ov").className="";$("ov").innerHTML="";showing=false;manual=false;next();
  }
  function next(){
    if(showing)return;
    if(queue.length){var e=queue.shift();openLetter(e,HOLD);return}
    if(auto&&entries.length){timer=setTimeout(function(){
      if(showing)return; autoIdx=(autoIdx+1)%entries.length; openLetter(entries[entries.length-1-autoIdx],HOLD)},1500)}
  }
  function askDelete(e){
    var t=document.querySelector(".ovtools"); clearTimeout(timer);
    t.innerHTML='<div class="pin"><input type="password" id="pinIn" placeholder="PIN admin" aria-label="PIN admin"><button id="pinOk">Hapus</button><button id="pinNo">Batal</button></div>';
    $("pinIn").focus();
    $("pinNo").onclick=function(){openLetter(e,0)};
    $("pinOk").onclick=async function(){
      var r=await fetch("/api/hapus",{method:"POST",headers:{"content-type":"application/json","x-pin":$("pinIn").value},body:JSON.stringify({id:e.id})});
      var j=await r.json().catch(function(){return{}});
      if(!r.ok){toast(j.error||"Gagal menghapus");openLetter(e,0);return}
      entries=entries.filter(function(x){return x.id!==e.id});delete known[e.id];render();closeLetter();toast("Dihapus");
    };
  }
  $("grid").addEventListener("click",function(ev){
    var b=ev.target.closest(".card");if(!b)return;
    var e=entries.find(function(x){return x.id===b.getAttribute("data-id")});if(e){queue=[];openLetter(e,0)}
  });
  document.addEventListener("keydown",function(ev){
    if(!showing)return;
    if(ev.target.id==="pinIn")return;
    if(ev.key==="Escape")closeLetter();
  });

  /* ----- polling ----- */
  async function poll(){
    try{
      var r=await fetch("/api/daftar?after="+encodeURIComponent(afterKey),{cache:"no-store"});
      var j=await r.json(), changed=false;
      var alive={}; j.ids.forEach(function(i){alive[i]=1});
      var before=entries.length;
      entries=entries.filter(function(e){return alive[e.id]});
      if(entries.length!==before)changed=true;
      j.entries.forEach(function(e){
        if(known[e.id])return; known[e.id]=1; changed=true;
        if(!first){e._new=true;queue.push(e)}
        entries.push(e);
      });
      entries.sort(function(a,b){return a.id<b.id?-1:1});
      if(j.ids.length)afterKey=j.ids[j.ids.length-1];
      if(changed||first)render();
      first=false; if(!showing)next();
    }catch(x){}
    setTimeout(poll,3000);
  }

  /* ----- controls ----- */
  $("bAuto").onclick=function(){auto=!auto;this.setAttribute("aria-pressed",auto);try{localStorage.setItem("auto",auto?"1":"0")}catch(x){}if(auto&&!showing)next()};
  $("bFull").onclick=function(){var d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(d.requestFullscreen)d.requestFullscreen().catch(function(){toast("Layar penuh tidak didukung browser ini")})};
  $("bAlbum").onclick=async function(){
    var b=this;b.disabled=true;var o=b.textContent;
    try{
      var out=[];
      for(var i=0;i<entries.length;i++){
        b.textContent="Menyiapkan "+(i+1)+"/"+entries.length;var e=entries[i],img="";
        if(e.hasPhoto){var r=await fetch(photo(e));var bl=await r.blob();img=await new Promise(function(res){var f=new FileReader();f.onload=function(){res(f.result)};f.readAsDataURL(bl)})}
        out.push('<article><h2>Dari '+esc(e.name)+'</h2>'+(img?'<img src="'+img+'" alt="">':'')+'<p>'+esc(e.message)+'</p></article>');
      }
      var t=esc($("ttl").textContent);
      var html='<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+t+'</title><style>body{font-family:Georgia,serif;max-width:680px;margin:0 auto;padding:24px 16px;color:#2B1816;background:#FBF6F4}h1{border-bottom:3px solid #C2271D;padding-bottom:12px}article{background:#fff;border:1px solid #EADBD6;border-radius:10px;padding:18px;margin:18px 0;break-inside:avoid}h2{margin:0 0 10px;font-size:18px;text-align:center}img{display:block;max-width:100%;margin:0 auto 12px;border-radius:8px}p{white-space:pre-wrap;line-height:1.65;text-align:center;margin:0}</style><h1>'+t+'</h1>'+out.join("")+'</html>';
      var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));a.download="album-kenangan.html";document.body.appendChild(a);a.click();a.remove();
    }catch(x){toast("Gagal menyiapkan album")}
    b.disabled=false;b.textContent=o;
  };
  try{ if(window.QRCode){var u=location.origin+"/";$("qr").hidden=false;new QRCode($("qrbox"),{text:u,width:128,height:128,correctLevel:QRCode.CorrectLevel.M})} }catch(x){}
  render();poll();
})();
</script>
</body>
</html>
